  <link rel="stylesheet" href="filters.css">

<body>
  <div class="auth-page"><div class="auth-card" id="auth-card"></div></div>
  <script src="i18n.js"></script>
  <script>
    function escapeHtml(text) {
      const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
      return text.replace(/[&<>"']/g, function (m) { return map[m]; });
    }

    const AUTH_ERRORS = {
      'invalid credentials': 'auth.errInvalid',
      'too many attempts, try later': 'auth.errLocked',
      'too many login attempts at once, try later': 'auth.errBusy',
      'account setup is allowed only from a local address': 'auth.errSetupLocal',
      'auth already configured': 'auth.errConfigured',
      'auth not configured': 'auth.errNotConfigured',
      'username must be 3..64 chars': 'auth.errUsername',
      'password must be at least 8 chars': 'auth.errPasswordShort',
      'auth error': 'auth.errServer',
      'invalid body': 'auth.errServer',
    };

    function authErrorText(data, status) {
      const key = data && AUTH_ERRORS[data.error];
      if (!key) return (data && data.error) || 'HTTP ' + status;
      let msg = t(key, {s: formatWait(data.retry_after || 60)});
      if (data.retry_after && key === 'auth.errInvalid') msg += '. ' + t('auth.errLocked', {s: formatWait(data.retry_after)});
      else if (typeof data.attempts_left === 'number') msg += '. ' + t('auth.errAttemptsLeft', {n: data.attempts_left});
      return msg;
    }

    function nextUrl() {
      const n = new URLSearchParams(location.search).get('next');
      // URLSearchParams декодирует %09 и %0a в управляющие символы, а браузер
      // вырезает их из URL: '/<tab>/host' превращается в '//host'
      if (!n || !n.startsWith('/') || /[\u0000-\u001f\u007f\\]/.test(n)) return '/';
      const u = new URL(n, location.origin);
      // после нормализации '/..//host' дает путь '//host', а это протокол-относительный адрес
      if (u.origin !== location.origin || u.pathname.startsWith('//')) return '/';
      return u.pathname + u.search + u.hash;
    }

    async function init() {
      let state = null;
      try {
        const res = await fetch('/api/auth/state');
        if (res.ok) state = await res.json();
      } catch (_) {}

      if (state && state.configured && state.authenticated) {
        location.replace(nextUrl());
        return;
      }

      // запрос упал, показываем вход: предлагать настройку тому, у кого уже
      // может быть аккаунт, хуже
      const isSetup = state !== null && !state.configured;
      const card = document.getElementById('auth-card');

      card.innerHTML =
        '<h2 class="auth-title">' + escapeHtml(t(isSetup ? 'auth.setupTitle' : 'auth.loginTitle')) + '</h2>' +
        '<p class="auth-hint">' + escapeHtml(t(isSetup ? 'auth.setupHint' : 'auth.loginHint')) + '</p>' +
        '<form id="auth-form" class="auth-form" autocomplete="on">' +
        '<div class="form-group">' +
        '<label class="form-label" for="auth-username">' + escapeHtml(t('auth.username')) + '</label>' +
        '<input type="text" class="input" id="auth-username" autocomplete="username" required></div>' +
        '<div class="form-group">' +
        '<label class="form-label" for="auth-password">' + escapeHtml(t('auth.password')) + '</label>' +
        '<input type="password" class="input" id="auth-password" autocomplete="' +
        (isSetup ? 'new-password' : 'current-password') + '" required></div>' +
        '<div class="auth-error hidden" id="auth-error"></div>' +
        '<div class="auth-actions">' +
        '<button type="submit" class="btn btn-primary" id="auth-submit">' +
        escapeHtml(t(isSetup ? 'auth.create' : 'auth.signIn')) + '</button>' +
        '</div></form>';

      const form = document.getElementById('auth-form');
      const errBox = document.getElementById('auth-error');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('auth-submit');
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value;
        btn.disabled = true;
        errBox.classList.add('hidden');
        try {
          const res = await fetch(isSetup ? '/api/auth/setup' : '/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Ripperr': '1'},
            body: JSON.stringify({username: username, password: password}),
          });
          if (!res.ok) {
            let data = null;
            try {
              data = await res.json();
            } catch (_) {}
            errBox.textContent = authErrorText(data, res.status);
            errBox.classList.remove('hidden');
            btn.disabled = false;
            return;
          }
          location.replace(nextUrl());
        } catch (err) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
          btn.disabled = false;
        }
      });

      const first = document.getElementById('auth-username');
      if (first) first.focus();
    }

    init();
  </script>
</body>
</html>
